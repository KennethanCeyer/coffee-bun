name: Cross-Platform CI & Installation Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-install:
    name: Build, Test & Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit Tests across All Packages
        run: go test -v ./...

      - name: Run Bootstrap Installer (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./install.sh
          ./install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Bootstrap Installer (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          "$HOME\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Installed CLI Commands (version, help, check, doctor)
        run: |
          bun version
          bun --help
          bun check
          bun doctor

      - name: Verify Real Package Installation (macOS & Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 1. Install cross-platform Vim runtime, MesloLGS Nerd Fonts, and Zoxide via OS package manager
          bun install vim-runtime meslo-font zoxide

          # 2. Verify installed status via bun check
          bun check
          bun check | grep -E "\[OK\].*Ultimate Vim Runtime"
          bun check | grep -E "\[OK\].*MesloLGS NF Font"
          bun check | grep -E "\[OK\].*Zoxide"

          # 3. Verify custom YAML configuration installation & verification
          cat << 'EOF' > ci-bun.yaml
          version: "1.0"
          hooks:
            pre_install: "echo pre-install-ok"
            post_install: "echo post-install-ok"
          packages:
            - id: ci-custom-tool
              name: "CI Custom Tool"
              description: "End-to-end custom YAML installation test"
              category: "CI Verification"
              type: "script"
              check_file: "~/ci-tool-installed.marker"
              install_cmd: "echo installed > ~/ci-tool-installed.marker"
          EOF

          bun -C ci-bun.yaml install ci-custom-tool
          bun -C ci-bun.yaml check | grep -F "CI Custom Tool"
          rm -f ci-bun.yaml ~/ci-tool-installed.marker

      - name: Verify Real Package Installation (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. Install cross-platform Vim runtime, MesloLGS Nerd Fonts, and Zoxide via Windows package manager
          bun install vim-runtime meslo-font zoxide

          # 2. Verify installed status via bun check
          $out = (bun check | Out-String)
          Write-Host $out
          if ($out -notmatch "Ultimate Vim Runtime") { throw "Vim Runtime check failed" }
          if ($out -notmatch "MesloLGS NF Font") { throw "Meslo Font check failed" }
          if ($out -notmatch "Zoxide") { throw "Zoxide check failed" }

          # 3. Verify custom YAML configuration installation in PowerShell
          @"
          version: "1.0"
          hooks:
            pre_install: "Write-Output pre-install-ok"
            post_install: "Write-Output post-install-ok"
          packages:
            - id: ci-custom-tool
              name: "CI Custom Tool"
              description: "End-to-end custom YAML installation test"
              category: "CI Verification"
              type: "script"
              check_file: "~/ci-tool-installed.marker"
              install_cmd: "Set-Content -Path `$HOME/ci-tool-installed.marker -Value installed"
          "@ | Set-Content -Path ci-bun.yaml -Encoding utf8

          bun -C ci-bun.yaml install ci-custom-tool
          $customOut = (bun -C ci-bun.yaml check | Out-String)
          if ($customOut -notmatch "CI Custom Tool") { throw "Custom YAML tool check failed" }
          Remove-Item -Force ci-bun.yaml, "$HOME/ci-tool-installed.marker" -ErrorAction SilentlyContinue
